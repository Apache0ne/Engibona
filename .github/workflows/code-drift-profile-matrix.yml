name: code-drift-profile-matrix

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - ci-code-drift-profile-v15

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[hf,test]"
      - name: Unit tests
        run: pytest -q
      - name: Official behavior and code-drift profile matrix
        run: |
          python experiments/official_qwen3vl_text/run_code_drift_profile_matrix.py \
            --seeds 3 \
            --layers 4 8 \
            --teacher-steps 80 \
            --recovery-steps 120 \
            --batch 12 \
            --threads 4 \
            --output code_drift_profile_matrix.json
      - uses: actions/upload-artifact@v4
        with:
          name: code-drift-profile-matrix
          path: code_drift_profile_matrix.json
          if-no-files-found: error
