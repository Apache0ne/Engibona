name: shared-embedding-ablation

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - ci-embedding-lineage-v16

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[hf,test]"
      - name: Unit tests
        run: pytest -q
      - name: Compare independent and shared embedding recovery
        run: |
          python experiments/official_qwen3vl_text/run_shared_embedding_ablation.py \
            --seeds 5 \
            --layers 2 4 \
            --teacher-steps 80 \
            --recovery-steps 150 \
            --batch 12 \
            --zero-target 0.312 \
            --threads 4 \
            --output shared_embedding_ablation.json
      - uses: actions/upload-artifact@v4
        with:
          name: shared-embedding-ablation
          path: shared_embedding_ablation.json
          if-no-files-found: error
