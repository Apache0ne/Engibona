name: paired-operator-forensics

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - name: Install CPU analysis dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install safetensors huggingface_hub requests numpy pandas
      - name: Paired public operator forensics
        run: |
          python experiments/public_bonsai_forensics/run_paired_operator_forensics.py \
            --layers 0 13 27 \
            --probes 16 \
            --output paired_operator_forensics.json
      - uses: actions/upload-artifact@v4
        with:
          name: paired-operator-forensics
          path: paired_operator_forensics.json
          if-no-files-found: error
