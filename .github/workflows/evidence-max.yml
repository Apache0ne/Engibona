name: loss-objective-evidence

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[hf,test]"
      - name: Unit tests
        run: pytest -q
      - name: Official Qwen3-VL recovery-loss matrix
        run: |
          python experiments/official_qwen3vl_text/run_official_loss_matrix.py \
            --seeds 3 \
            --layers 2 4 \
            --teacher-steps 80 \
            --recovery-steps 100 \
            --batch 12 \
            --threads 4 \
            --output official_qwen3vl_loss_matrix.json
      - uses: actions/upload-artifact@v4
        with:
          name: loss-objective-results
          path: official_qwen3vl_loss_matrix.json
          if-no-files-found: error
