name: gauge-forensics

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - ci-gauge-forensics-v9

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - name: Install CPU analysis dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install safetensors huggingface_hub requests numpy pandas
      - name: Test row-column gauges and separable scale changes
        run: |
          python experiments/public_bonsai_forensics/run_gauge_forensics.py \
            --rows-per-tensor 128 \
            --group-columns-per-tensor 32 \
            --output-dir gauge_forensics
      - uses: actions/upload-artifact@v4
        with:
          name: gauge-forensics
          path: gauge_forensics
          if-no-files-found: error
