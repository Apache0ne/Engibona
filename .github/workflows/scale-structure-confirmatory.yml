name: scale-structure-confirmatory

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - ci-scale-structure-v14

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[hf,test]"
      - name: Unit tests
        run: pytest -q
      - name: Confirm scale-structure regularization
        run: |
          python experiments/official_qwen3vl_text/run_scale_structure_confirmatory.py \
            --binary-coefficients 0 0.03 0.1 0.3 1 \
            --ternary-coefficients 0 0.3 1 3 10 \
            --seeds 8 \
            --layers 2 4 8 \
            --teacher-steps 80 \
            --recovery-steps 100 \
            --batch 12 \
            --threads 4 \
            --output scale_structure_confirmatory.json
      - uses: actions/upload-artifact@v4
        with:
          name: scale-structure-confirmatory
          path: scale_structure_confirmatory.json
          if-no-files-found: error
