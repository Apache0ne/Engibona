name: gradient-direction-forensics

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - ci-gradient-direction-v17

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      PYTORCH_ALLOC_CONF: "expandable_segments:True"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - name: Install CPU model dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -e ".[hf]" hf_xet pandas requests
      - name: Show runner resources
        run: |
          free -h
          df -h
      - name: Compare released code moves with KD and CE gradients
        run: |
          python experiments/public_bonsai_forensics/run_gradient_direction_forensics.py \
            --layers 0 13 27 \
            --block-rows 16 \
            --blocks 4 \
            --max-length 96 \
            --threads 4 \
            --output-dir gradient_direction_forensics
      - name: Show final resources
        if: always()
        run: |
          free -h
          df -h
      - uses: actions/upload-artifact@v4
        with:
          name: gradient-direction-forensics
          path: gradient_direction_forensics
          if-no-files-found: error
