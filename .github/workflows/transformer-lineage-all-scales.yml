name: transformer-lineage-all-scales

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - ci-transformer-lineage-v21

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - name: Install CPU analysis dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install huggingface_hub requests numpy pandas
      - name: Decompose shared and branch-specific released code lineage
        run: |
          python experiments/public_bonsai_forensics/run_transformer_lineage_all_scales.py \
            --groups-per-tensor 128 \
            --workers 8 \
            --output-dir transformer_lineage_all_scales
      - uses: actions/upload-artifact@v4
        with:
          name: transformer-lineage-all-scales
          path: transformer_lineage_all_scales
          if-no-files-found: error
