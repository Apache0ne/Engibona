name: public-weight-forensics-4b

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - name: Install CPU analysis dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install safetensors huggingface_hub requests numpy pandas
      - name: Stream Qwen and public Bonsai 4B weights
        run: |
          python experiments/public_bonsai_forensics/run_streaming_weight_forensics_tied.py \
            --base Qwen/Qwen3-4B \
            --binary prism-ml/Bonsai-4B-unpacked \
            --ternary prism-ml/Ternary-Bonsai-4B-unpacked \
            --group-size 128 \
            --groups-per-tensor 512 \
            --seed 1337 \
            --output-dir public_bonsai_forensics_4b
      - name: Tensor-cluster confidence intervals
        run: |
          python experiments/public_bonsai_forensics/summarize_confidence.py \
            --input public_bonsai_forensics_4b/tensor_metrics.csv \
            --output public_bonsai_forensics_4b/confidence_intervals.json \
            --iterations 4000
      - uses: actions/upload-artifact@v4
        with:
          name: public-bonsai-forensics-4b
          path: public_bonsai_forensics_4b
          if-no-files-found: error
