name: pooled-functional-alignment

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - ci-functional-alignment-v12

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      PYTORCH_ALLOC_CONF: "expandable_segments:True"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - name: Install CPU model dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -e ".[hf]" hf_xet
      - name: Show runner resources
        run: |
          free -h
          df -h
      - name: Compare pooled hidden and logit alignment
        run: |
          python experiments/public_bonsai_forensics/run_pooled_functional_alignment_clean.py \
            --selected-layers 0 7 14 21 28 \
            --max-length 128 \
            --logit-positions 8 \
            --projection-dimension 128 \
            --threads 4 \
            --output pooled_functional_alignment.json
      - name: Show final resources
        if: always()
        run: |
          free -h
          df -h
      - uses: actions/upload-artifact@v4
        with:
          name: pooled-functional-alignment
          path: pooled_functional_alignment.json
          if-no-files-found: error
