name: full-functional-forensics

on:
  workflow_dispatch:
  push:
    branches:
      - ci-full-functional-forensics-v7

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - name: Install CPU model dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -e ".[hf]" hf_xet
      - name: Show runner resources
        run: |
          free -h
          df -h
      - name: Compare full public models
        run: |
          python experiments/public_bonsai_forensics/run_full_model_functional_forensics.py \
            --threads 4 \
            --max-length 48 \
            --output full_model_functional_forensics.json
      - name: Show final resources
        if: always()
        run: |
          free -h
          df -h
      - uses: actions/upload-artifact@v4
        with:
          name: full-model-functional-forensics
          path: full_model_functional_forensics.json
          if-no-files-found: error
